name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icarus-mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: icarus-mobile/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo install --check
      - run: npm run export
